<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form id="login">

        <label for="name">Nombre completo</label><br>
        <input type="text" placeholder="nombreaaaa" id="name" autocomplete="off" name="name" required>

        <br><br>

        <label for="user">Usuario</label><br>
        <input type="text" placeholder="Usuaio" id="user" name="user" autocomplete="off">

        <br><br>

        <label for="tag">tag</label>
        <input type="text" maxlength="3" autocapitalize="on" placeholder="LAN" name="tag" id="tag">

        <br><br>

        <label for="country">Pais</label>
        <select name="country" id="country">
            <option value="CO">Colombia</option>
            <option value="ME">México</option>
            <option value="PE">Perú</option>
        </select>

        <br><br>

        <label for="phone">Celular</label>
        <input type="tel" placeholder="3207654321" name="phone" id="phone">

        <br><br>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="example@email.com">

        <br><br>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mi contraseña">

        <br><br>

        <label for="rep-password">Repetir contraseña</label>
        <input type="password" id="rep-password" name="rep-password" placeholder="Mi contraseña">

        <br><br>

        <p>Rol del sistema:</p>

            <input type="radio" id="user-role" name="role" checked value="user">
            <label for="user-role">Usuario</label>

            <input type="radio" id="mod-role" name="role" value="mod">
            <label for="mod-role">Moderador</label>

            <input type="radio" id="admin-role" name="role" value="admin">
            <label for="admin-role">Administrador</label>

        <br><br>

        <label for="color">Color favorito</label>
        <input type="color" name="color" id="color">


        <br><br>

        <button type="reset">Limpiar</button>
        <button type="submit">Enviar</button>


    </form>


</body>

    <script>

        const login = document.getElementById('login')

        login.addEventListener('submit', (data) => {

            data.preventDefault()

            const res = {};

            for (let element of data.target) {

                if (!element.name) continue;

                if (element.type === 'radio' && !element.checked) continue

                res[element.name] = element.value

            }

            console.log(res)


            const formData = new FormData(event.target);
            const formValues = Object.fromEntries(formData.entries());

            console.log(formData)
            console.log(formValues)
        })
    </script>
</html>
