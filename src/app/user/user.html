<h1>USER</h1>

@if ( logged ) {
    <p>Bienvenido {{ username }}</p>
    <button [disabled]="isDisable" (click)="logged = false">Cerrar sesión</button>
} @else {
    <p>Iniciar sesion</p>
    <button [disabled]="isDisable" (click)="logged = true">Inicia sesion</button>
}

<app-property
    (addDisableEvent)="getDisableButton($event)"
/>

<app-games
    (addFavoriteEvent)="getFavGame($event)"
    username="{{ username }}"
/>


@if (favGame) {
    <p>Tu juego favorito es {{ favGame }} </p>
}
